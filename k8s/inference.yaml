# Example manifests for the inference service only. The group writes the
# rest: gateway, API, worker, data services, Ingress or Gateway API,
# ConfigMap/Secret, HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  labels:
    app: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
        - name: inference
          # Pinned tag (never :latest): with :latest the pull policy becomes
          # Always and kind/minikube fail with ErrImagePull.
          image: inference:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # TODO(Final): move configuration to a ConfigMap and credentials
            # to a Secret.
            - name: CPU_WORK_MS
              value: "20"
          # The HPA computes CPU utilization against these requests.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  selector:
    app: inference
  ports:
    - port: 80
      targetPort: 8000
